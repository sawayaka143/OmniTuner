name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test -- --watch=false
      - run: npm run test:coverage -- --watch=false
      - run: npm run build
