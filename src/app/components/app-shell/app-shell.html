<header class="app-header">
  <div class="header-inner">
    <app-brand class="app-title" />
    <div class="header-actions">
      <button
        class="btn ghost help-trigger"
        type="button"
        aria-label="Keyboard shortcuts"
        [class.active]="shortcutOpen()"
        [attr.aria-expanded]="shortcutOpen()"
        (click)="shortcutOpen.set(true)"
      >
        <span class="app-icon ti ti-keyboard" aria-hidden="true"></span>
      </button>
      <app-icon-button
        #themeTrigger
        class="theme-trigger"
        [icon]="themeIcon()"
        [label]="themeLabel()"
        variant="ghost"
        (activate)="toggleTheme()"
      />
      <button
        class="btn ghost settings-trigger"
        type="button"
        aria-label="Settings"
        aria-controls="settings-dialog"
        [class.active]="settingsOpen()"
        [attr.aria-expanded]="settingsOpen()"
        (click)="settingsOpen.set(true)"
      >
        <span class="app-icon ti ti-settings" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</header>

<router-outlet />

<nav class="bottom-nav" aria-label="Primary navigation">
  <div class="bottom-nav-pill">
    <span
      class="nav-indicator"
      aria-hidden="true"
      [class.visible]="indicator().visible"
      [class.ready]="indicatorReady()"
      [style.transform]="'translateX(' + indicator().x + 'px)'"
      [style.width.px]="indicator().width"
    ></span>
    @for (item of navItems; track item.path) {
      <a
        class="nav-link"
        [routerLink]="item.path"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        #navLink
      >
        <span class="app-icon ti" [class]="item.icon" aria-hidden="true"></span>
        <span>{{ item.label }}</span>
      </a>
    }
  </div>
</nav>

<app-settings-panel
  [open]="settingsOpen()"
  [accent]="preferencesState().accent"
  [rootNoteColor]="preferencesState().rootNoteColor"
  [noteColor]="preferencesState().noteColor"
  [bgColor]="preferencesState().bgColor"
  [cardColor]="preferencesState().cardColor"
  [tunerSettings]="tunerSettings()"
  [theme]="theme()"
  (accentChange)="setAccent($event)"
  (rootNoteColorChange)="setRootNoteColor($event)"
  (noteColorChange)="setNoteColor($event)"
  (bgColorChange)="setBgColor($event)"
  (cardColorChange)="setCardColor($event)"
  (startupModeChange)="setTunerStartupMode($event)"
  (themeChange)="setThemeFromSettings($event)"
  (inTuneEnabledChange)="setInTuneEnabled($event)"
  (inTuneSoundChange)="setInTuneSound($event)"
  (inTuneGlowChange)="setInTuneGlow($event)"
  (inTuneColorChange)="setInTuneColor($event)"
  (outOfTuneColorChange)="setOutOfTuneColor($event)"
  (inTuneToleranceChange)="setInTuneTolerance($event)"
  (inTuneHoldMsChange)="setInTuneHoldMs($event)"
  (referencePitchChange)="setReferencePitch($event)"
  (dismiss)="settingsOpen.set(false)"
/>

<app-shortcut-help [open]="shortcutOpen()" (dismiss)="shortcutOpen.set(false)" />

<app-command-palette [open]="paletteOpen()" (dismiss)="paletteOpen.set(false)" />
