<div
  class="strings-grid"
  role="radiogroup"
  aria-label="Strings"
  [style.grid-template-columns]="'repeat(' + strings().length + ', 1fr)'"
>
  @for (str of strings(); track str.name) {
    <button
      class="string-btn"
      [class.active]="activeString() === str.name"
      [class.in-tune]="inTune() && activeString() === str.name"
      [class.tuned]="tunedStrings().includes(str.name)"
      type="button"
      role="radio"
      [attr.aria-checked]="activeString() === str.name"
      [title]="'Target ' + str.name"
      (click)="select.emit($index)"
    >
      <span class="string-note">{{ str.name }}</span>
    </button>
  }
</div>
