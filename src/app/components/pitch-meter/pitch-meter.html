<div class="horizontal-meter" role="meter" aria-label="Pitch deviation in cents, from minus 50 to plus 50">
  <div class="meter-track"></div>
  <div class="needle meter-needle" [class.in-tune]="isTuned()" [style.left]="needleLeft()"></div>
  <div class="ticks-container">
    @for (tick of ticks(); track $index) {
      <div class="meter-tick"
           [class.major]="tick.type === 'major'"
           [class.center]="tick.type === 'center'"
           [style.left]="tick.leftPos">
      </div>
    }
  </div>
  <div class="meter-labels">
    <span>-50</span>
    <span>-25</span>
    <span class="center-label">0</span>
    <span>+25</span>
    <span>+50</span>
  </div>
</div>
