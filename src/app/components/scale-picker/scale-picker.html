<div class="dropdown-wrapper">
  <button
    #trigger
    class="btn"
    type="button"
    [attr.aria-expanded]="open()"
    aria-haspopup="listbox"
    [attr.aria-controls]="open() ? menuId : null"
    (click)="toggle.emit(); $event.stopPropagation()"
    (keydown)="onTriggerKeydown($event)"
  >
    <span class="button-copy">
      <span class="button-kicker">Scale</span>
      <span class="value-wrap">
        <strong>{{ selectedLabel() }}</strong>
      </span>
    </span>
    <span
      class="app-icon ti ti-chevron-down dropdown-icon"
      [class.rotated]="open()"
      aria-hidden="true"
    >
    </span>
  </button>

  @if (open()) {
    <div
      #menu
      [id]="menuId"
      class="dropdown-menu card"
      role="listbox"
      aria-label="Scale selection"
      (click)="$event.stopPropagation()"
      (keydown)="onMenuKeydown($event)"
    >
      @for (group of groupedScales(); track group.label) {
        <div class="dropdown-group">{{ group.label }}</div>
        @for (scale of group.scales; track scale.id) {
          <button
            type="button"
            role="option"
            [attr.aria-selected]="selectedId() === scale.id"
            class="dropdown-item"
            [class.selected]="selectedId() === scale.id"
            (click)="select.emit(scale.id)"
          >
            <span>{{ scale.label }}</span>
            @if (scale.aka) {
              <span class="item-alt">{{ scale.aka }}</span>
            }
          </button>
        }
      }
    </div>
  }
</div>
