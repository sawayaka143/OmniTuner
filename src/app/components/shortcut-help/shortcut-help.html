<dialog
  #dialog
  class="shortcut-dialog"
  aria-labelledby="shortcut-help-title"
  (cancel)="requestDismiss($event)"
  (click)="onDialogClick($event)"
>
  <section class="shortcut-sheet">
    <header class="shortcut-header">
      <h2 id="shortcut-help-title">Keyboard shortcuts</h2>
      <app-icon-button icon="x" label="Close shortcuts" (activate)="requestDismiss()" />
    </header>

    <ul class="shortcut-list">
      @for (entry of entries; track entry.description) {
        <li class="shortcut-entry">
          <span class="shortcut-keys">
            @for (key of entry.keys; track $index) {
              <kbd>{{ key }}</kbd>
            }
          </span>
          <span class="shortcut-desc">{{ entry.description }}</span>
        </li>
      }
    </ul>
  </section>
</dialog>
