<div class="pitch-display">
  <div class="pitch-row">
    <span class="pitch-note" [class.in-tune]="isTuned()" [class.off]="offPitch()">{{ noteName() || '\u2014' }}</span>
    @if (octave(); as o) {
      <span class="pitch-octave" [class.in-tune]="isTuned()" [class.off]="offPitch()">{{ o }}</span>
    }
  </div>
  <div class="pitch-hz">{{ hz() }}</div>
  <p class="pitch-status" [class.locked]="isLocked()" [class.in-tune]="isTuned()">
    {{ statusMessage() }}
  </p>
</div>
