<div class="selectors" (click)="closeDropdown.emit()">
  <div
    class="seg instrument-seg indicator-accent"
    role="radiogroup"
    aria-label="Instrument selection"
    [style.--seg-count]="instruments().length"
    [appRovingRadioGroup]="true"
  >
    <div
      class="seg-indicator"
      [class.hidden]="plusActive()"
      [style.transform]="'translateX(' + selectedInstrumentIndex() * 100 + '%)'"
      aria-hidden="true"
    ></div>
    @for (inst of instruments(); track inst.id) {
      <button
        type="button"
        role="radio"
        [attr.aria-checked]="selectedInstrumentId() === inst.id"
        [class.active]="selectedInstrumentId() === inst.id"
        (click)="selectInstrument.emit(inst.id); $event.stopPropagation()"
      >
        {{ inst.label }}
      </button>
    }
    <button
      class="add-instrument-segment"
      [class.active]="plusActive()"
      type="button"
      aria-label="New instrument"
      [title]="'New instrument'"
      (click)="requestNewInstrument($event)"
    >
      <span class="app-icon ti ti-plus" aria-hidden="true"></span>
    </button>
  </div>

  <div class="dropdown-wrapper">
    <button
      class="btn tuning-trigger"
      type="button"
      [attr.aria-expanded]="dropdownOpen()"
      aria-haspopup="listbox"
      aria-controls="tuning-selector-menu"
      (click)="toggleDropdown.emit(); $event.stopPropagation()"
    >
      <span class="value-wrap">
        <span class="dropdown-label">{{ currentTuning().label }}</span>
      </span>
      <span
        class="app-icon ti ti-chevron-down dropdown-icon"
        [class.rotated]="dropdownOpen()"
        aria-hidden="true"
      ></span>
    </button>

    @if (dropdownOpen()) {
      <div id="tuning-selector-menu" class="dropdown-menu card" (click)="$event.stopPropagation()">
        <section class="menu-section" aria-labelledby="preset-tunings-heading">
          <h3 id="preset-tunings-heading">Presets</h3>
          <ul class="tuning-options" role="listbox" aria-labelledby="preset-tunings-heading">
            @for (tuning of presetTunings(); track tuning.id) {
              <li role="none">
                <button
                  class="tuning-option"
                  type="button"
                  role="option"
                  [attr.aria-selected]="selectedTuningId() === tuning.id"
                  [class.selected]="selectedTuningId() === tuning.id"
                  (click)="chooseTuning($event, tuning.id)"
                >
                  <span>{{ tuning.label }}</span>
                </button>
              </li>
            }
          </ul>
        </section>

        <section class="menu-section custom-section" aria-labelledby="custom-tunings-heading">
          <h3 id="custom-tunings-heading">Saved custom</h3>
          @if (customTunings().length > 0) {
            <ul class="tuning-options" role="listbox" aria-labelledby="custom-tunings-heading">
              @for (tuning of customTunings(); track tuning.id) {
                <li role="none" class="custom-row">
                  <button
                    class="tuning-option"
                    type="button"
                    role="option"
                    [attr.aria-selected]="selectedTuningId() === tuning.id"
                    [class.selected]="selectedTuningId() === tuning.id"
                    (click)="chooseTuning($event, tuning.id)"
                  >
                    <span>{{ tuning.label }}</span>
                  </button>
                  <div class="custom-actions" aria-label="Custom tuning actions">
                    <app-icon-button
                      icon="pencil"
                      [label]="'Edit ' + tuning.label"
                      [showTitle]="true"
                      [stopClickPropagation]="true"
                      variant="ghost"
                      size="sm"
                      (activate)="requestEdit(tuning.id)"
                    />
                    <app-icon-button
                      icon="trash"
                      [label]="'Delete ' + tuning.label"
                      [showTitle]="true"
                      [stopClickPropagation]="true"
                      variant="ghost"
                      size="sm"
                      [danger]="true"
                      (activate)="requestDelete(tuning.id)"
                    />
                  </div>
                </li>
              }
            </ul>
          } @else {
            <p class="empty-message">No custom tunings saved.</p>
          }
        </section>

        <button class="new-tuning-button" type="button" (click)="requestNewCustomTuning($event)">
          <span class="app-icon ti ti-plus" aria-hidden="true"></span>
          New custom tuning…
        </button>

        <button
          class="manage-instruments-button"
          type="button"
          (click)="requestManageInstruments($event)"
        >
          <span class="app-icon ti ti-adjustments-horizontal" aria-hidden="true"></span>
          Manage instruments
        </button>
      </div>
    }
  </div>
</div>
