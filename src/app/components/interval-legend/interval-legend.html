<ul class="legend" aria-label="Interval legend">
  @for (interval of intervals(); track interval.label) {
    <li class="legend-item">
      <span
        class="legend-swatch"
        [class.is-root]="isRoot(interval)"
        [style.background-color]="colorForLabel(interval.label)"
        [style.color]="textColorOn(colorForLabel(interval.label))">
        {{ interval.label }}
      </span>
    </li>
  }
</ul>
