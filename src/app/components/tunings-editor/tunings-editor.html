<dialog
  #dialog
  class="tuning-dialog"
  aria-labelledby="tuning-editor-title"
  aria-describedby="tuning-editor-subtitle"
  (cancel)="requestDismiss($event)"
  (click)="onDialogClick($event)"
>
  <div class="editor-card">
    <header class="editor-header">
      <div>
        @if (instrumentLabel()) {
          <span class="editor-kicker">{{ instrumentLabel() }}</span>
        }
        <h2 id="tuning-editor-title">
          {{ mode() === 'edit' ? 'Edit custom tuning' : 'New custom tuning' }}
        </h2>
        <p id="tuning-editor-subtitle">
          {{ mode() === 'edit' ? 'Update the name or string pitches' : 'Set each string one semitone at a time' }}
        </p>
      </div>
      <app-icon-button
        icon="close"
        label="Close tuning editor"
        (activate)="requestDismiss()"
      />
    </header>

    <app-string-editor
      [mode]="mode()"
      [initialName]="initialName()"
      [initialNotes]="initialNotes()"
      [presets]="presets()"
      [referenceNotes]="referenceNotes()"
      [minNote]="minMidiNote()"
      [maxNote]="maxMidiNote()"
      [maxNameLength]="maxNameLength()"
      [accidental]="accidental()"
      [allowCountChange]="false"
      nameLabel="Tuning name"
      stringsGroupLabel="String pitches"
      cancelLabel="Cancel"
      createLabel="Create tuning"
      editLabel="Save changes"
      (save)="save.emit($event)"
      (preview)="preview.emit($event)"
      (cancel)="requestDismiss()"
    />
  </div>
</dialog>
