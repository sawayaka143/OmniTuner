<dialog
  #dialog
  class="manager-dialog"
  aria-labelledby="manager-title"
  aria-describedby="manager-subtitle"
  (cancel)="requestDismiss($event)"
  (click)="onDialogClick($event)"
>
  <div class="manager-card">
    <header class="manager-header">
      <div>
        <span class="manager-kicker">OmniTuner</span>
        <h2 id="manager-title">{{ title() }}</h2>
        <p id="manager-subtitle">{{ subtitle() }}</p>
      </div>
      <app-icon-button icon="x" label="Close instrument manager" (activate)="requestDismiss()" />
    </header>

    <div class="manager-content">
      @if (mode() === 'list') {
        <ul class="instrument-list">
          @for (instrument of instruments(); track instrument.id) {
            <li class="instrument-row" [class.custom]="isCustom(instrument)">
              <div class="instrument-info">
                <strong>{{ instrument.label }}</strong>
                <span class="instrument-meta">
                  {{ instrument.stringCount }} strings
                  @if (!isCustom(instrument)) {
                    · built-in
                  }
                </span>
              </div>
              @if (isCustom(instrument)) {
                <div class="instrument-actions">
                  <app-icon-button
                    icon="pencil"
                    [label]="'Edit ' + instrument.label"
                    [showTitle]="true"
                    (activate)="startEdit(instrument)"
                  />
                  <app-icon-button
                    icon="trash"
                    [label]="'Delete ' + instrument.label"
                    [showTitle]="true"
                    [danger]="true"
                    (activate)="deleteInstrument(instrument)"
                  />
                </div>
              }
            </li>
          }
        </ul>

        <button class="new-instrument-button" type="button" (click)="startCreate()">
          <span class="app-icon ti ti-plus" aria-hidden="true"></span>
          New instrument
        </button>
      } @else {
        <app-string-editor
          [mode]="editorMode()"
          [initialName]="initialName()"
          [initialNotes]="initialNotes()"
          [initialStringCount]="initialStringCount()"
          [allowCountChange]="true"
          [minStringCount]="minStringCount"
          [maxStringCount]="maxStringCount"
          [minNote]="minMidiNote"
          [maxNote]="maxMidiNote"
          [disallowedNames]="disallowedNames()"
          [externalError]="externalError()"
          nameLabel="Instrument name"
          stringsGroupLabel="Default tuning notes"
          cancelLabel="Back"
          createLabel="Create instrument"
          editLabel="Save changes"
          (save)="saveFromComposite($event)"
          (cancel)="backToList()"
        />
      }
    </div>
  </div>
</dialog>
