<div class="dial-shell">
  <div
    #dial
    class="dial"
    role="slider"
    tabindex="0"
    [attr.aria-valuenow]="bpm()"
    [attr.aria-valuemin]="1"
    [attr.aria-valuemax]="800"
    aria-label="Tempo"
    [attr.aria-valuetext]="bpm() + ' beats per minute'"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp($event)"
    (pointercancel)="onPointerUp($event)"
    (keydown)="onKeydown($event)"
  >
    <svg class="dial-svg" viewBox="0 0 300 300" aria-hidden="true">
      <circle cx="150" cy="150" r="143" class="dial-well" />
      <g class="dial-face" [attr.transform]="faceTransform()">
        <circle cx="150" cy="150" r="140" class="dial-plate" />
        <circle cx="150" cy="150" r="128" class="dial-rim" />
        @for (t of ticks; track $index) {
          <line
            class="dial-tick"
            [attr.x1]="t.x1"
            [attr.y1]="t.y1"
            [attr.x2]="t.x2"
            [attr.y2]="t.y2"
          />
        }
      </g>
      <circle cx="150" cy="150" r="92" class="dial-center" />
      <circle cx="150" cy="150" r="92" class="dial-center-line" />
      <polygon class="dial-pointer" points="150,23 144.5,12 155.5,12" />
    </svg>
  </div>

  <button type="button" class="tap-btn" (click)="onTapClick()" aria-label="Tap tempo">
    <span class="tap-inner">Tap</span>
  </button>
</div>
