<main class="app-main" (click)="closeDropdown()">
  <app-instrument-selector
    [instruments]="instruments()"
    [selectedInstrumentId]="selectedInstrumentId()"
    [selectedInstrumentIndex]="selectedInstrumentIndex()"
    [availableTunings]="availableTunings()"
    [selectedTuningId]="selectedTuningId()"
    [currentTuning]="currentTuning()"
    [dropdownOpen]="dropdownOpen()"
    [mode]="mode()"
    [plusActive]="plusActive()"
    (selectInstrument)="selectInstrument($event)"
    (selectTuning)="selectTuning($event)"
    (newCustomTuning)="openCreateTuning()"
    (newInstrument)="openCreateInstrument()"
    (editCustomTuning)="openEditTuning($event)"
    (deleteCustomTuning)="deleteCustomTuning($event)"
    (manageInstruments)="openInstrumentManager()"
    (toggleDropdown)="toggleDropdown()"
    (closeDropdown)="closeDropdown()"
    (modeChange)="selectMode($event)"
  />

  <app-instrument-manager
    [open]="instrumentManagerOpen()"
    [openInCreateMode]="instrumentManagerCreateMode()"
    (dismiss)="dismissInstrumentManager()"
  />

  <app-tuning-editor
    [open]="tuningEditorOpen()"
    [mode]="editingTuningId() !== null ? 'edit' : 'create'"
    [instrumentLabel]="currentInstrumentLabel()"
    [initialName]="editorInitialName()"
    [initialNotes]="editorInitialNotes()"
    [presets]="editorPresets()"
    [referenceNotes]="referenceNotes()"
    [minMidiNote]="minTunerMidiNote"
    [maxMidiNote]="maxTunerMidiNote"
    [maxNameLength]="maxCustomTuningNameLength"
    (save)="saveCustomTuning($event)"
    (dismiss)="dismissTuningEditor()"
  />

  <div class="tuner-stage">
    <div class="meter-area">
      <app-pitch-meter [ticks]="ticks" [needleLeft]="needleLeft()" [isTuned]="isTuned()" />

      <div class="pulse-layer" aria-hidden="true">
        @if (pulseActive()) {
          <span class="lock-pulse"></span>
        }
      </div>

      <app-pitch-display
        [noteName]="displayNoteName()"
        [octave]="displayOctave()"
        [hz]="currentHz()"
        [centsOffset]="centsOffset()"
        [statusMessage]="statusMessage()"
        [isLocked]="isLocked()"
        [isTuned]="isTuned()"
      />
    </div>

    <app-string-list
      [strings]="currentStrings()"
      [activeString]="activeString()"
      [inTune]="showTuned()"
      (select)="selectString($event)"
    />
  </div>

  <button
    (click)="toggleCapture()"
    class="btn primary capture-btn"
    [class.active]="isCapturing()"
    type="button"
    [attr.aria-pressed]="isCapturing()"
  >
    {{ isCapturing() ? 'Stop' : 'Start' }}
  </button>

  <span class="sr-only" aria-live="polite" aria-atomic="true">{{ statusMessage() }}</span>

  @if (showDebug) {
    <pre class="debug-hud" aria-hidden="true"
    ><span class="debug-hud__dot" [class.active]="isCapturing()"></span
    ><span class="debug-hud__label">DEBUG · temporary</span>
lvl {{ inputLevel().toFixed(3) }}
{{ debugInfo() }}
mode: {{ mode() }} | tuned: {{ showTuned() ? 'yes' : 'no' }} | cents: {{ debugCents() }}</pre>
  }
</main>
