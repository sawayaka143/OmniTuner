<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OmniTuner</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#121211" />
    <meta
      name="description"
      content="OmniTuner — chromatic instrument tuner with real-time pitch detection."
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      try {
        var k = 'omnituner.theme.v1';
        var s = localStorage.getItem(k);
        var t = null;
        if (s) {
          try {
            var j = JSON.parse(s);
            t = j && typeof j === 'object' ? j.theme || j.value : j;
          } catch (_) {
            t = s;
          }
        }
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
        var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'light' ? '#f1f0ec' : '#121211');
      } catch (_) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
